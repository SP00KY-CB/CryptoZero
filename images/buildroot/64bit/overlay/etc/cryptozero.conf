# CryptoZero PBA configuration (sourced by cz-lib.sh).
# Baked into the PBA image at build time -- the values used at enrollment
# MUST match the values in the image the machine boots from.

# Persistent TPM handle holding the sealed TPM secret.
CZ_TPM_HANDLE=0x81010020

# PCRs the sealed secret is bound to.  PCR 0 = firmware, 4 = boot manager
# (the syslinux EFI binary of this PBA).  See docs/TPM_CIK.md before adding
# PCR 7: this fork's UEFI PBA requires Secure Boot OFF, so PCR 7 then only
# attests "Secure Boot is off".
CZ_PCRS="sha256:0,4"

# 1 = TPM secret additionally requires a PIN (policyauthvalue; the TPM's own
# dictionary-attack lockout rate-limits guesses).
CZ_USE_PIN=1

# GPT partition name of the crypto ignition key partition on the microSD.
CZ_CIK_PARTNAME=CIK

# Seconds to wait for the microSD to enumerate.
CZ_CIK_WAIT=10
